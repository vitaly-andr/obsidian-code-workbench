# Builds the ABAP tree-sitter grammar to WebAssembly, verifies it under the exact web-tree-sitter
# the plugin bundles (0.26.9), and publishes the two assets to the fork's grammars-v1 release.
#
# This workflow is meant to run ON THE FORK (sigurdn/obsidian-code-workbench-abap): the built-in
# GITHUB_TOKEN then targets the fork, which is exactly the intended publish target. When this is
# upstreamed, the upstream grammars-v1 release should host the assets instead and the registry's
# fork override (ABAP_SELF_HOST in src/treesitter/registry.ts) should be dropped.
#
# GRAMMAR CHOICE: we build mkoval1/tree-sitter-abap, NOT kennyhml/tree-sitter-abap. kennyhml's is
# far more complete but its generated parser.c is ~hundreds of MB, and compiling THAT to wasm
# exhausted the free ubuntu-latest runner (repeated OOM kills at -O0, then a 45-min timeout — six
# failed runs). mkoval1's grammar is a small, pre-generated parser (src/parser.c ~2.2 MB, no
# external scanner) that compiles to wasm in seconds and ships a highlights.scm. It is a simpler/
# less complete grammar, which is an acceptable trade for editor syntax highlighting. The grammar
# is NOT vendored: CI clones it fresh at the pinned SHA below.
name: Build ABAP grammar

on:
  # Manual dispatch from the fork's Actions tab — this is the normal way to run it.
  workflow_dispatch:
  # Also rebuild when this workflow file itself changes on the feature branch, so edits are exercised.
  push:
    branches:
      - feature/abap-source-support
    paths:
      - .github/workflows/build-abap-grammar.yml

permissions:
  # Needed to create/update the grammars-v1 release and upload assets.
  contents: write

env:
  # Pinned mkoval1/tree-sitter-abap commit (main HEAD). Small, pre-generated grammar — see header.
  GRAMMAR_REPO: https://github.com/mkoval1/tree-sitter-abap
  GRAMMAR_SHA: c7604df9e25d56ae879fa25694fd9f2ddbab05d8
  # tree-sitter-cli pinned to the SAME version as the bundled web-tree-sitter runtime (0.26.9) so the
  # emitted parser ABI (15) is exactly what that runtime supports (it is backward- but not
  # forward-compatible). The library accepts ABI 14 or 15; 0.26.9 emits 15 by default.
  TREE_SITTER_CLI_VERSION: 0.26.9
  RELEASE_TAG: grammars-v1

jobs:
  build:
    runs-on: ubuntu-latest
    # Backstop against a genuine hang. The mkoval1 grammar compiles in well under a minute, so this
    # budget is generous.
    timeout-minutes: 20
    steps:
      - name: Checkout plugin repo
        # Provides the verify script (tests/runtime/verify-abap-grammar.mjs) and, via npm install,
        # the exact web-tree-sitter@0.26.9 the verification runs against.
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install plugin dependencies
        # Brings in web-tree-sitter@0.26.9 so the verify script can import it.
        run: npm install --no-audit --no-fund

      - name: Install tree-sitter CLI (pinned)
        run: npm install -g tree-sitter-cli@${TREE_SITTER_CLI_VERSION}

      - name: Cache tree-sitter WASI SDK
        # tree-sitter build --wasm downloads a WASI SDK the first time and caches it here; this keeps
        # repeat runs fast. No Docker and no Emscripten are involved on this path.
        uses: actions/cache@v4
        with:
          path: ~/.cache/tree-sitter
          key: tree-sitter-wasi-${{ env.TREE_SITTER_CLI_VERSION }}

      - name: Clone grammar at pinned SHA
        run: |
          git clone "$GRAMMAR_REPO" grammar-src
          git -C grammar-src checkout "$GRAMMAR_SHA"
          git -C grammar-src rev-parse HEAD

      - name: Show toolchain versions
        # Printed so a failed run's log states exactly which CLI/node/grammar files were in play.
        working-directory: grammar-src
        run: |
          echo "node: $(node --version)"
          echo "tree-sitter: $(tree-sitter --version)"
          echo "--- src/ contents ---"
          ls -l src/ || true

      - name: Regenerate parser (ABI match)
        # mkoval1 ships a committed src/parser.c, but it was generated by an older CLI. Regenerate
        # with the pinned 0.26.9 CLI so the emitted ABI (15) matches the web-tree-sitter runtime.
        # This grammar is small and has no external scanner, so generate is fast and safe.
        working-directory: grammar-src
        timeout-minutes: 5
        run: |
          tree-sitter generate
          echo "parser.c: $(wc -l < src/parser.c) lines"

      - name: Build wasm
        # Compiles with the WASI SDK (auto-downloaded, cached above). The mkoval1 parser.c is ~2.2 MB
        # and has no external scanner, so this finishes in seconds — none of the OOM/timeout trouble
        # the large kennyhml grammar caused.
        working-directory: grammar-src
        timeout-minutes: 10
        run: |
          tree-sitter build --wasm -o tree-sitter-abap.wasm .
          ls -l tree-sitter-abap.wasm

      - name: Collect build outputs
        # Use THIS repo's grammars/abap.highlights.scm (an expanded query — full kw() keyword set
        # plus type/string/operator/identifier rules), not the grammar's smaller upstream query.
        run: |
          cp grammar-src/tree-sitter-abap.wasm tree-sitter-abap.wasm
          cp grammars/abap.highlights.scm tree-sitter-abap.highlights.scm
          ls -l tree-sitter-abap.wasm tree-sitter-abap.highlights.scm

      - name: Verify under web-tree-sitter 0.26.9
        # Loads the wasm, asserts the ABI, parses representative ABAP fixtures, and compiles the
        # highlights query against the loaded Language. Any failure (including a non-compiling
        # highlights query) fails the job.
        run: node tests/runtime/verify-abap-grammar.mjs ./tree-sitter-abap.wasm ./tree-sitter-abap.highlights.scm

      - name: Upload build artifact
        # Makes the two files inspectable from the run even before they are published.
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-abap
          path: |
            tree-sitter-abap.wasm
            tree-sitter-abap.highlights.scm

      - name: Publish to grammars-v1 release on the fork
        # Runs only after verification passes. Create the release on first run; on re-runs the create
        # fails (release exists) and we fall back to uploading with --clobber so assets are replaced.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" tree-sitter-abap.wasm tree-sitter-abap.highlights.scm \
            --title "$RELEASE_TAG" \
            --notes "ABAP tree-sitter grammar built from mkoval1/tree-sitter-abap@${GRAMMAR_SHA} (web-tree-sitter 0.26.9)" \
          || gh release upload "$RELEASE_TAG" tree-sitter-abap.wasm tree-sitter-abap.highlights.scm --clobber
